name: Create Blog Post from Issue by Ran

on:
  issues:
    types: [opened, edited]

jobs:
  blog_post_generator:
    if: contains(github.event.issue.labels.*.name, 'blog')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js for slugify
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install slugify and GitHub CLI
      run: |
        npm install slugify
        sudo apt-get update
        sudo apt-get install gh -y

    - name: Extract metadata and generate blog post
      id: create_post
      run: |
        TITLE="${{ github.event.issue.title }}"
        BODY="${{ github.event.issue.body }}"
        DATE=$(date +%Y-%m-%d)
        SLUG=$(npx slugify "$TITLE" --lower --separator "-")
        ISSUE_NUMBER=${{ github.event.issue.number }}
        FILENAME="_posts/${DATE}-${ISSUE_NUMBER}-${SLUG}.md"

        mkdir -p _posts

        # Metadata extraction
        AUTHOR=$(echo "$BODY" | grep -i '^author:' | sed 's/^author:[ ]*//I' || echo "Unknown")
        TAGS=$(echo "$BODY" | grep -i '^tags:' | sed 's/^tags:[ ]*//I' || echo "")

        echo "Creating $FILENAME"
        {
          echo "---"
          echo "title: \"$TITLE\""
          echo "date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "layout: post"
          echo "author: \"$AUTHOR\""
          if [ ! -z "$TAGS" ]; then echo "tags: [$TAGS]"; fi
          echo "---"
          echo ""
          echo "$BODY" | grep -viE '^(author|tags):'
        } > "$FILENAME"

        echo "FILENAME=$FILENAME" >> $GITHUB_ENV
        echo "SLUG=$SLUG" >> $GITHUB_ENV

    - name: Commit blog post
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "New blog post from issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
        file_pattern: '_posts/*.md'

    - name: Comment with preview link and close issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        REPO=${{ github.repository }}
        ISSUE_NUMBER=${{ github.event.issue.number }}
        POST_URL="https://rjhinrichs.github.io/aimoralcode/${{ env.SLUG }}"

        gh api repos/$REPO/issues/$ISSUE_NUMBER/comments \
          -f body="✅ Blog post published at [$POST_URL]($POST_URL) and saved as \`${{ env.FILENAME }}\`"

        gh api repos/$REPO/issues/$ISSUE_NUMBER \
          -X PATCH -F state=closed
