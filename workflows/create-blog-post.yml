
nname: Create Blog Post from Issue

on:
  issues:
    types: [opened, edited]

jobs:
  create_blog_or_wiki_draft:
    if: contains(github.event.issue.labels.*.name, 'blog')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for slugify)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install slugify
        run: npm install slugify

      - name: Create filename and folder
        id: vars
        run: |
          TITLE="${{ github.event.issue.title }}"
          DATE=$(date +%Y-%m-%d)
          SLUG=$(npx slugify "$TITLE" --lower --separator "-")
          FILENAME="${DATE}-${SLUG}.md"
          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Create markdown file in wiki-drafts
        run: |
          mkdir -p wiki-drafts
          BODY="${{ github.event.issue.body }}"
          AUTHOR=$(echo "$BODY" | grep -i '^author:' | sed 's/^author:[ ]*//I' || echo "Unknown")
          TAGS=$(echo "$BODY" | grep -i '^tags:' | sed 's/^tags:[ ]*//I' || echo "")

          echo "---" > wiki-drafts/$FILENAME
          echo "title: \"$TITLE\"" >> wiki-drafts/$FILENAME
          echo "date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> wiki-drafts/$FILENAME
          echo "layout: post" >> wiki-drafts/$FILENAME
          echo "author: \"$AUTHOR\"" >> wiki-drafts/$FILENAME
          if [ ! -z "$TAGS" ]; then
            echo "tags: [$TAGS]" >> wiki-drafts/$FILENAME
          fi
          echo "---" >> wiki-drafts/$FILENAME
          echo "" >> wiki-drafts/$FILENAME
          echo "$BODY" | grep -viE '^(author|tags):' >> wiki-drafts/$FILENAME

      - name: Commit wiki draft
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Staged new wiki draft for admin review: $TITLE"
          file_pattern: 'wiki-drafts/*.md'

      - name: Comment for admin review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          ISSUE_NUMBER=${{ github.event.issue.number }}
          gh api repos/$REPO/issues/$ISSUE_NUMBER/comments \
            -f body="📝 Draft saved to \`wiki-drafts/${{ env.FILENAME }}\`.  
            
A maintainer (e.g., @ranhinrichs) must:
- ✅ Add the \`admin-approved\` label to publish this to the blog
- ✏️ Add \`needs-revision\` for feedback
- 📄 Leave as-is to keep it in the wiki

This process keeps our front page canonical while supporting community learning."

