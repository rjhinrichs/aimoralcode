
name: Create Blog Post

on:
  issues:
    types: [opened, edited]

jobs:
  create-blog-post:
    if: contains(github.event.issue.labels.*.name, 'blog')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js for slugify
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install slugify
        run: npm install -g slugify

      - name: Generate blog post from issue
        id: generate
        run: |
          TITLE="${{ github.event.issue.title }}"
          BODY="${{ github.event.issue.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          REPO="${{ github.repository }}"
          AUTHOR="${{ github.event.issue.user.login }}"
          DATE=$(date +'%Y-%m-%d')
          SLUG=$(slugify "$TITLE" --lower --separator "-")
          FILENAME="_posts/${DATE}-${SLUG}.md"

          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "AUTHOR=$AUTHOR" >> $GITHUB_ENV
          echo "POST_URL=https://aimoralcode.org/posts/${DATE}-${SLUG}/" >> $GITHUB_ENV

          echo "---" > "$FILENAME"
          echo "title: \"$TITLE\"" >> "$FILENAME"
          echo "date: $DATE" >> "$FILENAME"
          echo "author: $AUTHOR" >> "$FILENAME"
          echo "tags:" >> "$FILENAME"
          echo "  - blog" >> "$FILENAME"
          echo "---" >> "$FILENAME"
          echo "" >> "$FILENAME"

          echo "$BODY" >> "$FILENAME"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Create ${{ env.FILENAME }}"
          file_pattern: _posts/*.md

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments             -f body="✅ Blog post published at [${{ env.POST_URL }}](${{ env.POST_URL }}) and saved as \`${{ env.FILENAME }}\`"
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}             -X PATCH -F state=closed
