# ===============================
#  Netlify configuration for AI Moral Code (Decap CMS)
# ===============================

[build]
  command = "echo 'Static build complete'"
  publish = "."

[build.environment]
  NODE_VERSION = "18.20.3"
  JEKYLL_ENV = "disabled"

[context.deploy-preview]
  command = "echo 'Deploy preview build complete'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
