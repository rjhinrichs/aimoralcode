# ===============================
#  Netlify configuration for AI Moral Code (Decap CMS)
# ===============================

[build]
  # There is no true build step; this site is static.
  command = "echo 'Static build complete'"
  publish = "/"

[build.environment]
  NODE_VERSION = "18"
  JEKYLL_ENV = "disabled"

# Optional: automatically deploy previews for branches
[context.deploy-preview]
  command = "echo 'Deploy preview build complete'"
  publish = "aimoralcode"

# Optional headers (can be customized later)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
