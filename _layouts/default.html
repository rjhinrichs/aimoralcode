<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/values.css' | relative_url }}">

  <!-- SEO Tags -->
  {% seo %}

  <!-- Optional: Favicon -->
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">

  <!-- Auth0 -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/1.22/auth0-spa-js.production.js"></script>
</head>
<body>

  {% include header.html %}

  <div class="layout">
    {% include sidebar.html %}

    <main>
      {{ content }}
      <div style="text-align:center; margin: 2rem;">
        <button id="loginBtn">Login as Admin</button>
        <button id="adminButton" style="display:none;" onclick="window.location.href='https://github.com/rjhinrichs/aimoralcode/issues/1';">
          Add New Blog Post
        </button>
      </div>
    </main>
  </div>

  <footer style="padding: 1rem 2rem; border-top: 1px solid #ccc;">
    <p>&copy; 2025 Randy J. Hinrichs | AI Moral Code Project</p>
    <p>
      <a href="mailto:ran@aimoralcode.org">ran@aimoralcode.org</a> |
      <a href="https://github.com/rjhinrichs/aimoralcode" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
    </p>
  </footer>

  <!-- Auth0 Login Logic -->
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const auth0 = await createAuth0Client({
      domain: "dev-8gs6y65g7spa5sl0.us.auth0.com",
      client_id: "0EzPNcUnF90rZtyqL9JtTqlu11lZGhgE",
      cacheLocation: "localstorage"
    });

    const isAuthenticated = await auth0.isAuthenticated();
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.createElement("button");
    logoutBtn.textContent = "Logout";
    logoutBtn.style.marginLeft = "1rem";
    logoutBtn.style.display = "none";
    logoutBtn.onclick = async () => {
      await auth0.logout({ logoutParams: { returnTo: window.location.origin } });
    };
    loginBtn.parentNode.appendChild(logoutBtn);

    if (isAuthenticated) {
      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";
      document.getElementById("adminButton").style.display = "inline-block";
    } else {
      loginBtn.style.display = "inline-block";
      loginBtn.addEventListener("click", async () => {
        await auth0.loginWithRedirect({ authorizationParams: { redirect_uri: window.location.href } });
      });

      if (window.location.search.includes("code=") && window.location.search.includes("state=")) {
        await auth0.handleRedirectCallback();
        window.history.replaceState({}, document.title, "/");
        window.location.reload();
      }
    }
  });
  </script>

</body>
</html>
