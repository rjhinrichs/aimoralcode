name: Notify Admin of New Blog Contribution

on:
  issues:
    types: [opened]

jobs:
  send-email:
    if: contains(github.event.issue.labels.*.name, 'blog')
    runs-on: ubuntu-latest
    steps:
      - name: Send admin notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ADMIN_EMAIL_USERNAME }}
          password: ${{ secrets.ADMIN_EMAIL_PASSWORD }}
          subject: "New Blog Contribution Received"
          to: ${{ secrets.ADMIN_EMAIL_USERNAME }}
          from: "AI Moral Code Notifier <${{ secrets.ADMIN_EMAIL_USERNAME }}>"
          secure: true
          body: |
            A new blog post has been submitted to the AI Moral Code repository:
            👉 https://github.com/rjhinrichs/aimoralcode/issues

            Please review the submission and determine whether to publish, respond, or move it to the wiki queue.
