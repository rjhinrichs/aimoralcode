name: Notify Admin on Contributor Blog Submission

on:
  issues:
    types: [opened, labeled]

jobs:
  notify-admin:
    if: github.event.label.name == 'blog'
    runs-on: ubuntu-latest
    steps:
      - name: Send email to admin
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ADMIN_EMAIL_USERNAME }}
          password: ${{ secrets.ADMIN_EMAIL_PASSWORD }}
          subject: "New Blog Contribution Received"
          to: hinr6383@vandals.uidaho.edu
          from: AI Moral Code Bot <${{ secrets.ADMIN_EMAIL_USERNAME }}>
          body: |
            A new blog post was submitted and labeled 'blog'.
            Repository: ${{ github.repository }}
            Title: ${{ github.event.issue.title }}
            URL: ${{ github.event.issue.html_url }}
