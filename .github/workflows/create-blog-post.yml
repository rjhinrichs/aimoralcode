name: Create Blog Post

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'

jobs:
  commit-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Check for changes in _posts
        run: |
          CHANGES=$(git diff --name-only HEAD^ HEAD | grep '^_posts/' || true)
          if [ -z "$CHANGES" ]; then
            echo "🟢 No _posts changes detected. Skipping commit."
            exit 0
          else
            echo "📝 _posts changes found:"
            echo "$CHANGES"
            git diff --cached --name-status
          fi

      - name: Commit and push changes
        run: |
          git add .
          git diff --cached --quiet && echo "⚠️ No changes to commit." && exit 0
          git commit -m "Automated blog post update"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
