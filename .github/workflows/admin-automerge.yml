name: Auto-Merge Approved Blog PR

on:
  pull_request:
    types: [labeled]

jobs:
  merge:
    if: github.event.label.name == 'admin-approved'
    permissions:
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --admin -t "Merge approved blog post" -b "Merged by automation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}