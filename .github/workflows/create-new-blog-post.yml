name: Create New Blog Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Post title'
        required: true
        type: string
      date:
        description: 'Publish date in ISO format (e.g., 2025-07-05T12:00:00Z)'
        required: true
        type: string
      author:
        description: 'Author name'
        required: true
        type: string
      tags:
        description: 'Comma-separated list of tags (no brackets)'
        required: true
        type: string
      summary:
        description: 'Short post summary'
        required: true
        type: string
      content:
        description: 'Full Markdown body content'
        required: true
        type: string

jobs:
  build-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up filename and slug
        id: vars
        run: |
          SLUG=$(echo "${{ github.event.inputs.title }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -dc '[:alnum:]-')
          FILENAME="_posts/${{ github.event.inputs.date | cut -c1-10 }}-${SLUG}.md"
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT

      - name: Create blog post file
        run: |
          FILE="${{ steps.vars.outputs.filename }}"
          echo "---" > "$FILE"
          echo "title: \"${{ github.event.inputs.title }}\"" >> "$FILE"
          echo "date: ${{ github.event.inputs.date }}" >> "$FILE"
          echo "author: ${{ github.event.inputs.author }}" >> "$FILE"
          echo "tags: [${{ github.event.inputs.tags }}]" >> "$FILE"
          echo "layout: post" >> "$FILE"
          echo "summary: \"${{ github.event.inputs.summary }}\"" >> "$FILE"
          echo "---" >> "$FILE"
          echo "${{ github.event.inputs.content }}" >> "$FILE"

      - name: Commit and push blog post
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add _posts/
          git commit -m "New blog post: ${{ github.event.inputs.title }}"
          git push
