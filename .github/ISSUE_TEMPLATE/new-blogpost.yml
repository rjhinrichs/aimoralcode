name: New Blog Post
description: Submit a new blog post for publication
title: "[BLOG] "
labels: ["blog"]
body:
  - type: input
    id: title
    attributes:
      label: Blog Post Title
      description: The title of your blog post
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author Name
      description: Your name (as you want it credited)
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      description: Example: ai-ethics, simulation, moral-code
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: Blog Content
      description: Write your full blog post in Markdown format
    validations:
      required: true
